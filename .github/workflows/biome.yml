name: Code quality

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Use the Biome version locked in package-lock.json, the same one the
      # pre-commit hook runs; setup-biome resolved package.json's range to the
      # newest release, which can format differently.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Biome
        run: npx biome ci
