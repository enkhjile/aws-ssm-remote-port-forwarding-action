name: Code quality

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Detects the version from package-lock.json (falling back to the highest
      # match for package.json's range). @biomejs/biome is pinned with "~", so
      # CI stays on the same minor version as the pre-commit hook.
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Run Biome
        run: biome ci
